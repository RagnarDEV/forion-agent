name = "forion-agent"
main = "src/index.js"
compatibility_date = "2026-10-26"

[ai]
binding = "AI"

[vars]
# الدمج التلقائي معطّل افتراضيًا: غيّره إلى "true" فقط بعد تفعيل حماية الفرع
# وإضافة فحوصات مطلوبة كافية (انظر .github/workflows/agent-check.yml).
AUTO_MERGE = "false"
MODEL = "@cf/zai-org/glm-4.7-flash"

[assets]
directory = "./public"
binding = "ASSETS"

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true
