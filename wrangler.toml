name = "forion-agent"
main = "src/index.js"
compatibility_date = "2026-10-26"

[ai]
binding = "AI"

[vars]
# الدمج التلقائي معطّل افتراضيًا: غيّره إلى "true" فقط بعد تفعيل حماية الفرع
# وإضافة فحوصات مطلوبة كافية (انظر .github/workflows/agent-check.yml).
AUTO_MERGE = "false"

# النموذج الأساسي (GLM-4.7-Flash). الوضع الافتراضي Smart Auto: الموجّه الذكي يختار النموذج لكل مرحلة
# (GLM-4.7-Flash أو GPT-OSS-20B بعد نجاح «اختبار التوافق» من الإعدادات)، ولا حاجة لتغيير هذا المتغير.
MODEL = "@cf/zai-org/glm-4.7-flash"

# للتشخيص فقط: إلغاء التعليق يثبّت نموذجًا واحدًا لكل المراحل ويعطّل التوجيه والتبديل.
# PIN_MODEL = "@cf/zai-org/glm-4.7-flash"

# ميزانية الاستدعاءات الخارجية للطلب (الافتراضي 45 للخطة المجانية). ارفعها فقط إن سمحت خطتك بأكثر.
# SUBREQUEST_LIMIT = "45"

[assets]
directory = "./public"
binding = "ASSETS"

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true
